name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build iOS App (.app)
      run: |
        xcodebuild -workspace *.xcworkspace -scheme Madeira -configuration Release -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          BUILD_DIR=build \
          clean build || \
        xcodebuild -project *.xcodeproj -scheme Madeira -configuration Release -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          BUILD_DIR=build \
          clean build

    - name: Create IPA Package
      run: |
        mkdir -p Payload
        APP_PATH=$(find build/Release-iphoneos -name "*.app" | head -n 1)
        cp -R "$APP_PATH" Payload/
        zip -r Madeira.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Madeira-Unsigned-IPA
        path: Madeira.ipa
